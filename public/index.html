<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ede2;
    --paper-dark: #e7e0d0;
    --ink: #21293a;
    --ink-soft: #5b6274;
    --stamp: #b3402f;
    --stamp-dark: #8f3125;
    --ok: #3f6b4a;
    --line: rgba(33, 41, 58, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper-dark);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .receipt {
    width: 100%;
    max-width: 400px;
    background: var(--paper);
    box-shadow: 0 1px 0 rgba(33,41,58,0.05), 0 20px 40px -24px rgba(33,41,58,0.35);
    padding: 32px 28px 28px;
    position: relative;
  }

  .receipt::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -11px;
    height: 22px;
    background:
      radial-gradient(circle at 10px 0, transparent 10px, var(--paper) 10.5px) 0 -11px / 20px 22px repeat-x;
  }

  .brand {
    text-align: center;
    margin-bottom: 4px;
  }

  .brand .mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    text-align: center;
    margin: 6px 0 2px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 20px 0;
  }

  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .field { margin-bottom: 18px; }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  textarea {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 6px 2px 8px;
    outline: none;
  }

  input:focus, textarea:focus {
    border-bottom: 1px solid var(--ink);
  }

  textarea { resize: none; height: 44px; }

  .amount-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .amount-row span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--ink-soft);
  }
  .amount-row input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
  }

  .capture-box {
    border: 1px dashed var(--line);
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .capture-box.has-image { border-style: solid; }
  .capture-box:active { background: rgba(33,41,58,0.03); }

  .capture-box .hint {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .capture-box img {
    max-width: 100%;
    max-height: 220px;
    display: block;
    margin: 0 auto 10px;
  }

  input[type="file"] { display: none; }

  button.submit {
    width: 100%;
    background: var(--stamp);
    color: #f8f4ec;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button.submit:hover { background: var(--stamp-dark); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled {
    background: var(--ink-soft);
    cursor: not-allowed;
  }

  .status {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--stamp); }

  .foot {
    text-align: center;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

  <form class="receipt" id="receiptForm">
    <div class="brand"><span class="mark">·  ·  ·</span></div>
    <h1>Receipt Drop</h1>
    <p class="subtitle">Snap it, log it, done.</p>

    <label for="photoInput">Photo</label>
    <div class="capture-box" id="captureBox">
      <div class="hint" id="captureHint">Tap to take a photo or choose one</div>
      <img id="preview" style="display:none;" alt="Receipt preview">
      <input type="file" id="photoInput" accept="image/*" capture="environment" required>
    </div>

    <div class="field">
      <label for="amount">Amount</label>
      <div class="amount-row">
        <span>$</span>
        <input type="number" step="0.01" min="0" id="amount" placeholder="0.00" required>
      </div>
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>

    <div class="field">
      <label for="note">What was it for?</label>
      <textarea id="note" placeholder="e.g. client lunch, office supplies"></textarea>
    </div>

    <div class="field">
      <label for="submitter">Your name</label>
      <input type="text" id="submitter" placeholder="So they know who sent it" required>
    </div>

    <hr class="divider">

    <button type="submit" class="submit" id="submitBtn">Submit receipt</button>
    <div class="status" id="status"></div>
  </form>

  <p class="foot">Filed straight to the ledger</p>

<script>
  const form = document.getElementById('receiptForm');
  const photoInput = document.getElementById('photoInput');
  const captureBox = document.getElementById('captureBox');
  const captureHint = document.getElementById('captureHint');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('date').valueAsDate = new Date();

  captureBox.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      captureHint.style.display = 'none';
      captureBox.classList.add('has-image');
    };
    reader.readAsDataURL(file);
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = photoInput.files[0];
    if (!file) {
      statusEl.textContent = 'Add a photo of the receipt first.';
      statusEl.className = 'status err';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'Filing receipt…';
    statusEl.className = 'status';

    try {
      const imageBase64 = await fileToBase64(file);
      const res = await fetch('/.netlify/functions/submit-receipt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imageBase64,
          mimeType: file.type,
          amount: document.getElementById('amount').value,
          date: document.getElementById('date').value,
          note: document.getElementById('note').value,
          submitter: document.getElementById('submitter').value,
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Submission failed');

      statusEl.textContent = 'Filed. Thanks!';
      statusEl.className = 'status ok';
      form.reset();
      document.getElementById('date').valueAsDate = new Date();
      preview.style.display = 'none';
      captureHint.style.display = 'block';
      captureBox.classList.remove('has-image');
    } catch (err) {
      statusEl.textContent = err.message || 'Something went wrong. Try again.';
      statusEl.className = 'status err';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
